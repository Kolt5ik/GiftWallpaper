[package]
name = "giftwallpaper"
version = "0.2.2"
edition = "2024"
description = "Open-source desktop wallpaper generator for Telegram collectible gifts"
license = "MIT"
repository = "https://github.com/Kolt5ik"

[dependencies]
eframe = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "1"
urlencoding = "2.1"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
